# ============================================
# 1. Cấu hình kết nối MySQL
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/job_platform?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:01228923505}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# 2. Cấu hình Hibernate (JPA MySQL)
# ============================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# 3. Đổi cổng chạy
# ============================================
server.port=${PORT:8090}

# ============================================
# 4. Cấu hình Upload File (CV, Logo, Avatar)
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads

# ============================================
# 5. JWT Secret Key
# ============================================
jwt.secret=ChuyenDeTotNghiepCongNghePhanMemSTU2026
jwt.access-token-expiry=420000
jwt.refresh-token-expiry=432000

# ============================================
# 6. GROQ API KEY
# ============================================
groq.api-keys=${GROQ_API_KEYS}

# ============================================
# 7. Cấu hình gửi Email (JavaMailSender)
# ============================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true